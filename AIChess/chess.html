<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chess Game - AI Chess Arena</title>

    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 24px;
    color: #f5f1e8;

    background:
        radial-gradient(
            circle at top,
            rgba(128, 92, 35, 0.20),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #090909,
            #17130d 50%,
            #080808
        );
}

/* =========================
   USER BAR
========================= */

.user-bar {
    max-width: 1250px;
    margin: 0 auto 18px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 12px 18px;

    background: rgba(24, 20, 15, 0.92);

    border: 1px solid rgba(212, 175, 85, 0.25);
    border-radius: 10px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);
}

#welcomeUser {
    font-size: 15px;
    font-weight: 600;
    color: #d9b86c;
}

.logout-btn {
    width: auto;
    margin: 0;

    padding: 8px 16px;

    border: 1px solid rgba(212, 175, 85, 0.3);
    border-radius: 7px;

    background: #211b13;
    color: #e8d39b;

    cursor: pointer;
}

.logout-btn:hover {
    background: #332718;
}

/* =========================
   HEADER
========================= */

.top {
    text-align: center;
    margin-bottom: 28px;
}

.top h1 {
    font-size: 38px;
    letter-spacing: 1px;

    color: #e5c579;

    text-shadow:
        0 3px 15px rgba(0,0,0,0.7);
}

.top p {
    margin-top: 8px;

    color: #aaa294;
    font-size: 14px;
    letter-spacing: 1px;
}

/* =========================
   PLAYER VS AI
========================= */

.players-bar {
    max-width: 650px;
    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.player-card {
    flex: 1;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 12px 16px;

    background:
        linear-gradient(
            145deg,
            rgba(39,32,23,0.98),
            rgba(19,17,14,0.98)
        );

    border: 1px solid rgba(212,175,85,0.25);

    border-radius: 10px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.35);
}

.player-icon {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #d8c095;

    color: #17120d;

    font-size: 25px;

    flex-shrink: 0;
}

.player-label {
    display: block;

    margin-bottom: 3px;

    color: #b9954d;

    font-size: 10px;
    font-weight: bold;

    letter-spacing: 1px;
}

.player-card strong {
    display: block;

    color: #eee5d4;

    font-size: 14px;
}

.versus {
    color: #cda95e;

    font-size: 13px;
    font-weight: bold;

    letter-spacing: 1px;
}


/* Mobile */

@media (max-width: 900px) {

    .players-bar {
        width: min(650px, 94vw);
    }

}

@media (max-width: 500px) {

    .players-bar {
        gap: 8px;
    }

    .player-card {
        padding: 10px;
    }

    .player-icon {
        width: 34px;
        height: 34px;

        font-size: 20px;
    }

    .player-card strong {
        font-size: 12px;
    }

    .versus {
        font-size: 11px;
    }

}

/* =========================
   MAIN GAME AREA
========================= */

.game-container {
    max-width: 1250px;
    margin: auto;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    gap: 35px;
}

/* =========================
   CHESS BOARD
========================= */

.board {
    width: min(650px, 78vw);
    height: min(650px, 78vw);

    display: grid;

    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);

    border: 8px solid #2b2115;

    border-radius: 6px;

    overflow: hidden;

    box-shadow:
        0 0 0 1px #b38a45,
        0 18px 50px rgba(0,0,0,0.65),
        0 0 45px rgba(179,138,69,0.12);
}

.square {
    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
    user-select: none;

    font-size: clamp(28px, 6vw, 55px);

    font-family:
        "Segoe UI Symbol",
        "DejaVu Sans",
        sans-serif;

    font-variant-emoji: text;

    transition:
        filter 0.15s ease,
        transform 0.1s ease;
}

.square:hover {
    filter: brightness(1.12);
}

/* Board colors */

.light {
    background: #d9c39a;
}

.dark {
    background: #765634;
}

/* Pieces */

.white-piece {
    color: #fffaf0 !important;

    text-shadow:
        1px 2px 2px #000,
        0 0 5px rgba(255,255,255,0.25);
}

.black-piece {
    color: #17120d !important;

    text-shadow:
        1px 1px 1px rgba(255,255,255,0.15);
}

/* =========================
   SIDE PANEL
========================= */

.side-panel {
    width: 330px;

    padding: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(39,32,23,0.98),
            rgba(19,17,14,0.98)
        );

    border: 1px solid rgba(212,175,85,0.25);

    border-radius: 14px;

    box-shadow:
        0 18px 45px rgba(0,0,0,0.55);
}

.side-panel h2 {
    margin-bottom: 22px;

    font-size: 21px;

    color: #e1bf70;

    letter-spacing: 0.5px;
}

/* =========================
   STATUS
========================= */

.status {
    padding: 17px;

    margin-bottom: 18px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 10px;
}

.status strong {
    display: block;

    margin-bottom: 7px;

    color: #cda95e;

    font-size: 13px;

    text-transform: uppercase;
    letter-spacing: 1px;
}

#turnStatus {
    color: #eee5d4;
    font-size: 16px;
}

/* =========================
   MOVE HISTORY
========================= */

.move-history {
    padding: 17px;

    margin-bottom: 20px;

    background: rgba(0,0,0,0.25);

    border: 1px solid rgba(255,255,255,0.07);

    border-radius: 10px;
}

.move-history h3 {
    margin-bottom: 10px;

    color: #d6b66b;

    font-size: 15px;
}

#moveHistory {
    max-height: 190px;

    overflow-y: auto;

    color: #d4d0c7;

    font-size: 14px;

    line-height: 1.8;
}

#moveHistory::-webkit-scrollbar {
    width: 5px;
}

#moveHistory::-webkit-scrollbar-thumb {
    background: #80612e;
    border-radius: 10px;
}

/* =========================
   AI OPTION
========================= */

.option {
    margin-bottom: 18px;
}

.option label {
    display: block;

    margin-bottom: 8px;

    color: #cdb06e;

    font-size: 13px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: 0.8px;
}

select {
    width: 100%;

    padding: 12px;

    background: #17130f;

    color: #eee5d4;

    border: 1px solid rgba(212,175,85,0.28);

    border-radius: 7px;

    outline: none;

    font-size: 14px;

    cursor: pointer;
}

select:focus {
    border-color: #caa85e;
}

/* =========================
   BUTTONS
========================= */

button {
    width: 100%;

    padding: 12px;

    margin-top: 9px;

    border: 1px solid rgba(212,175,85,0.28);

    border-radius: 7px;

    background:
        linear-gradient(
            135deg,
            #9c783b,
            #6f5028
        );

    color: #fff8e8;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}

button:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
}

button:active {
    transform: translateY(0);
}

.home-btn {
    background: #29251f;
    color: #cfc5b0;
}

.home-btn:hover {
    background: #393229;
}
.dashboard-btn {
    background: #302718;
    color: #dfc47c;
}

.dashboard-btn:hover {
    background: #44351f;
}

.history-btn {
    background: #25221e;
    color: #d5c8ad;
}

.history-btn:hover {
    background: #39332a;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

    body {
        padding: 15px;
    }

    .game-container {
        flex-direction: column;
        align-items: center;
    }

    .board {
        width: min(650px, 94vw);
        height: min(650px, 94vw);
    }

    .side-panel {
        width: min(650px, 94vw);
    }

}

@media (max-width: 600px) {

    .top h1 {
        font-size: 28px;
    }

    .top p {
        font-size: 12px;
    }

    .user-bar {
        flex-direction: column;
        gap: 10px;
    }

    .board {
        border-width: 5px;
    }

    .side-panel {
        padding: 20px;
    }

}

</style>

</head>

    <!-- Login Check -->

    <script>

        fetch("user")

            .then(response => response.text())

            .then(username => {

                if (username === "Guest") {

                    window.location.href = "login.html";

                    return;
                }

                document.getElementById("welcomeUser").textContent =

            .catch(error => {

</html>
