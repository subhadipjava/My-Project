<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>AI Chess Dashboard</title>

    <style>

        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(
            rgba(0, 0, 0, 0.60),
            rgba(0, 0, 0, 0.60)
        ),
        url("dashboard-bg.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
}

        .header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
    background: rgba(20, 20, 20, 0.85);
    width: 180px;
    padding: 25px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
}

        .card h3 {
            margin-top: 0;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .buttons {
            text-align: center;
            margin-top: 40px;
        }

        button {
            padding: 12px 22px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .play {
            background: #222;
            color: white;
        }

        .history {
            background: #555;
            color: white;
        }

        .logout {
            background: #b00020;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

    </style>
</head>

<body>

    <div class="header">
        <h1>♟️ AI Chess Dashboard</h1>
        <p>AI-Based Chess Game and Analysis System</p>
    </div>

    <div class="container">

        <div class="welcome">
            <h2 id="welcomeUser">Welcome!</h2>
            <p>Your Chess Statistics</p>
        </div>

        <div class="stats">

            <div class="card">
                <h3>Games Played</h3>
                <div class="number" id="gamesPlayed">0</div>
            </div>

            <div class="card">
                <h3>Wins</h3>
                <div class="number" id="wins">0</div>
            </div>

            <div class="card">
                <h3>Losses</h3>
                <div class="number" id="losses">0</div>
            </div>

            <div class="card">
                <h3>Draws</h3>
                <div class="number" id="draws">0</div>
            </div>

        </div>

        <div class="buttons">

            <button class="play"
                    onclick="location.href='chess.html'">
                ♟️ Play Chess
            </button>

            <button class="history"
                    onclick="location.href='history.html'">
                📜 Game History
            </button>

            <button class="logout"
                    onclick="location.href='logout'">
                🚪 Logout
            </button>

        </div>

    </div>

    <script>

        fetch("user")
            .then(response => response.text())
            .then(username => {

                if (username === "Guest") {
                    window.location.href = "login.html";
                    return;
                }

                document.getElementById("welcomeUser").textContent =
                    "Welcome, " + username + "!";
            })
            .catch(error => {

                console.error(
                    "Error checking login:",
                    error
                );

                window.location.href = "login.html";
            });


        fetch("stats")
            .then(response => response.json())
            .then(stats => {

                document.getElementById("gamesPlayed").textContent =
                    stats.gamesPlayed;

                document.getElementById("wins").textContent =
                    stats.wins;

                document.getElementById("losses").textContent =
                    stats.losses;

                document.getElementById("draws").textContent =
                    stats.draws;

            })
            .catch(error => {

                console.error(
                    "Error loading statistics:",
                    error
                );

            });

    </script>

</body>
</html>
